<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dilo — vídeo com IA</title>
<meta name="description" content="Clipe, personagem, vídeo pra negócio, curso e UGC. Vídeo com IA por quem edita desde 2020.">
<meta property="og:title" content="Dilo — vídeo com IA">
<meta property="og:description" content="Personagem que não muda de rosto. História do roteiro ao corte. Peça pronta sem o cliente gravar nada.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800;900&display=swap">
<style>
:root{
  --bg:#0A0A0A;
  --surface:#141413;
  --raised:#1A1A18;
  --ink:#F4F3F0;
  --ink-2:#A3A29C;
  --ink-3:#66655F;
  --line:#242422;
  --line-2:#33322F;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth; scroll-padding-top:64px}
body{margin:0; background:var(--bg); color:var(--ink); font-family:Archivo,system-ui,sans-serif; font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased}
img,video{display:block; max-width:100%}
[hidden]{display:none !important}
a{color:inherit}
p{margin:0}
h1,h2{margin:0; font-weight:900; letter-spacing:-.02em; line-height:1}
.wrap{max-width:1240px; margin:0 auto; padding:0 22px}

/* NAV */
.topnav{position:sticky; top:0; z-index:40; background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(14px); border-bottom:1px solid var(--line)}
.topnav-inner{max-width:1240px; margin:0 auto; padding:11px 22px; display:flex; align-items:center; gap:16px}
.mark{font-weight:900; font-size:1.05rem; letter-spacing:-.03em; flex:none}
.pills{display:flex; gap:4px; overflow-x:auto; scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{font-size:.74rem; font-weight:500; white-space:nowrap; color:var(--ink-3); text-decoration:none; padding:6px 12px; border-radius:99px; transition:color .18s, background .18s}
.pill:hover,.pill:focus-visible{color:var(--ink); background:var(--surface)}
.pill.on{color:var(--ink); background:var(--surface)}

/* HERO */
.hero{padding:52px 0 40px; display:flex; gap:20px; align-items:flex-start; flex-wrap:wrap}
.hero-main{flex:1 1 420px; min-width:0; display:grid; grid-template-columns:auto 1fr; gap:26px; align-items:center}
@media (max-width:640px){ .hero{grid-template-columns:1fr; gap:18px; padding:36px 0 30px} }
.avatar{width:104px; height:104px; border-radius:50%; object-fit:cover; border:1px solid var(--line-2); background:var(--surface)}
.avatar-fb{width:104px; height:104px; border-radius:50%; border:1px dashed var(--line-2); background:var(--surface); display:grid; place-items:center; font-size:.6rem; color:var(--ink-3); text-align:center; padding:10px; letter-spacing:.06em}
.hero h1{font-size:clamp(2.6rem,8vw,4.2rem)}
.hero .bio{color:var(--ink-2); font-size:.98rem; max-width:58ch; margin-top:12px}
.hero-links{display:flex; gap:8px; margin-top:16px; flex-wrap:wrap}
.hlink{font-size:.78rem; font-weight:500; text-decoration:none; color:var(--ink); border:1px solid var(--line-2); border-radius:99px; padding:8px 15px; transition:background .18s, border-color .18s}
.hlink:hover{background:var(--surface); border-color:var(--ink-3)}

/* FAIXA */
.rail{padding:30px 0; border-top:1px solid var(--line)}
.rail-head{display:flex; align-items:center; justify-content:space-between; gap:14px}
.rail-head h2{font-size:1.35rem}
.rail.lead .rail-head h2{font-size:1.9rem}
.rail-sub{color:var(--ink-3); font-size:.82rem; margin-top:5px}
.arrows{display:flex; gap:6px; align-items:center; flex:none}
.arrow{width:34px; height:34px; border-radius:99px; border:1px solid var(--line-2); background:transparent; color:var(--ink-2); cursor:pointer; display:grid; place-items:center; padding:0; transition:all .22s}
.arrow svg{width:14px; height:14px; transition:width .22s,height .22s}
.arrow:hover{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.arrow[disabled]{opacity:.2; pointer-events:none}
.arrow.live{border-color:var(--ink-2); color:var(--ink)}
.arrow.grow{width:54px; height:54px; background:var(--ink); color:var(--bg); border-color:var(--ink)}
.arrow.grow svg{width:22px; height:22px}

/* pílulas de ramificação: escolhe qual fila aparece */
.ramos{display:flex; gap:5px; flex-wrap:wrap; margin-top:14px}
.ramo{font-size:.72rem; font-weight:500; color:var(--ink-3); background:transparent; border:1px solid var(--line-2); border-radius:99px; padding:6px 13px; cursor:pointer; transition:all .18s; font-family:inherit}
.ramo:hover{color:var(--ink); border-color:var(--ink-3)}
.ramo.on{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.sub[hidden]{display:none}

/* sub-linha: cada ramificação tem a própria fila */
.sub{margin-top:22px}
.sub-head{display:flex; align-items:center; justify-content:space-between; gap:12px}
.sub-head h3{margin:0; font-size:.95rem; font-weight:600; color:var(--ink-2); letter-spacing:.01em}
.sub-head .arrows .arrow{width:30px; height:30px}
.sub-head .arrows .arrow svg{width:12px; height:12px}
.sub-head .arrows .arrow.grow{width:46px; height:46px}
.sub-head .arrows .arrow.grow svg{width:19px; height:19px}
.card[hidden]{display:none}

.rail-track{position:relative}
.rail-track::after{content:""; position:absolute; top:0; bottom:0; right:0; width:90px; pointer-events:none; opacity:0; transition:opacity .3s; background:linear-gradient(to right, transparent, var(--bg))}
.rail-track.more::after{opacity:1}
.track{display:flex; gap:12px; overflow-x:auto; scroll-behavior:smooth; scroll-snap-type:x proximity; padding:16px 0 4px; scrollbar-width:none}
.track::-webkit-scrollbar{display:none}

/* CARD */
.card{flex:0 0 206px; scroll-snap-align:start; display:flex; flex-direction:column; gap:9px; min-width:0}
.rail.lead .card{flex-basis:248px}
/* peça filmada em deitado: card mais largo e quadro 16:9 */
.card.wide{flex-basis:360px}
.rail.lead .card.wide{flex-basis:400px}
.card.wide .media{aspect-ratio:16/9}
.media{position:relative; aspect-ratio:9/16; border-radius:6px; overflow:hidden; background:var(--surface); transition:transform .3s}
.card.has-video .media{cursor:pointer}
.card.has-video:hover .media{transform:scale(1.02)}
.media video{width:100%; height:100%; object-fit:cover}
.media .empty{position:absolute; inset:0; display:grid; place-items:center; color:var(--ink-3); font-size:.62rem; letter-spacing:.14em; text-transform:uppercase}
.play-ico{position:absolute; left:12px; bottom:12px; width:32px; height:32px; border-radius:99px; background:rgba(10,10,10,.6); backdrop-filter:blur(6px); display:grid; place-items:center; pointer-events:none; transition:opacity .2s}
.play-ico svg{width:12px; height:12px; margin-left:2px; color:#fff}
.card.playing .play-ico{opacity:0}
.c-title{font-weight:600; font-size:.88rem; line-height:1.25}
.tags{display:flex; flex-wrap:wrap; gap:4px}
.tag{font-size:.62rem; font-weight:500; color:var(--ink-3); border:1px solid var(--line-2); border-radius:99px; padding:2px 8px; white-space:nowrap}

/* LIGHTBOX */
.lb{position:fixed; inset:0; z-index:100; background:rgba(5,5,5,.94); display:none; place-items:center; padding:20px}
.lb[open]{display:grid}
.lb video{max-height:88vh; max-width:min(480px,94vw); border-radius:8px; background:#000}
.lb-frame{width:min(960px,94vw); aspect-ratio:16/9; max-height:86vh; border:0; border-radius:8px; background:#000}
.media img{width:100%; height:100%; object-fit:cover}
.selo{position:absolute; right:9px; top:9px; font-size:.58rem; font-weight:600; padding:3px 8px; border-radius:99px; background:rgba(10,10,10,.72); backdrop-filter:blur(6px); color:#fff}
.grupo{margin:22px 0 2px; font-size:.72rem; font-weight:600; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-3)}
.lb-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:8px; width:min(880px,94vw); max-height:84vh; overflow-y:auto; overflow-x:hidden; padding:2px}
@media (max-width:520px){.lb-grid{grid-template-columns:repeat(auto-fit,minmax(110px,1fr))}}
.lb-grid img{width:100%; aspect-ratio:3/4; object-fit:contain; display:block; border-radius:8px; background:#111}
.lang{margin-left:auto; flex:0 0 auto; border:1px solid var(--linha); background:transparent; color:var(--ink-2); font:inherit; font-size:.68rem; font-weight:600; letter-spacing:.1em; padding:5px 10px; border-radius:99px; cursor:pointer}
.lang:hover{color:var(--ink); border-color:var(--ink-3)}
.curtir{flex:0 0 auto; display:inline-flex; align-items:center; gap:9px; border:1px solid var(--linha);
  background:transparent; color:var(--ink-2); font:inherit; font-size:.82rem; font-weight:600;
  padding:10px 18px; border-radius:99px; cursor:pointer; transition:color .18s, border-color .18s, transform .12s}
.curtir:hover{color:var(--ink); border-color:var(--ink-3)}
.curtir:active{transform:scale(.97)}
.curtir .coracao{width:17px; height:17px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linejoin:round}
.curtir.on{color:#ff4d6d; border-color:#ff4d6d}
.curtir.on .coracao{fill:#ff4d6d; stroke:#ff4d6d}
.curtir-n{font-variant-numeric:tabular-nums; opacity:.65}
.curtir-n:empty{display:none}
.lb-close{position:absolute; top:16px; right:18px; width:38px; height:38px; border-radius:99px; border:1px solid rgba(255,255,255,.22); background:transparent; color:#fff; cursor:pointer; display:grid; place-items:center}
.lb-cap{position:absolute; left:0; right:0; bottom:20px; text-align:center; color:rgba(255,255,255,.6); font-size:.76rem}

/* FECHAMENTO */
.closing{border-top:1px solid var(--line); margin-top:16px; padding:56px 0 20px; display:flex; flex-direction:column; gap:14px}
.closing h2{font-size:clamp(1.8rem,5vw,2.8rem)}
.closing p{color:var(--ink-2); max-width:48ch; font-size:.95rem}
.foot{padding:26px 0 52px; font-size:.7rem; color:var(--ink-3)}
@media (prefers-reduced-motion:reduce){ *{animation:none!important; transition:none!important} html{scroll-behavior:auto} }
</style>
</head>
<body>

<div class="topnav">
  <div class="topnav-inner">
    <span class="mark" id="mark"></span>
    <nav class="pills" id="nav"></nav>
    <button class="lang" id="lang" type="button" aria-label="Language">EN</button>
  </div>
</div>

<div class="wrap">
  <header class="hero" id="hero">
    <div class="hero-main" id="heroConteudo"></div>
    <button class="curtir" id="curtir" type="button" hidden>
      <svg class="coracao" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.3 4.6 13a4.6 4.6 0 0 1 6.5-6.5l.9.9.9-.9A4.6 4.6 0 1 1 19.4 13Z"/></svg>
      <span id="curtirTxt"></span><span class="curtir-n" id="curtirN"></span>
    </button>
  </header>
  <main id="faixas"></main>
  <section class="closing" id="contato">
    <h2>Manda a referência</h2>
    <p>Me diz o que você tem em mente. Eu produzo, você aprova.</p>
    <div class="hero-links" id="contatoLinks"></div>
  </section>
</div>

<div class="wrap"><p class="foot">Dilo · editando desde 2020</p></div>

<div class="lb" id="lb">
  <button class="lb-close" id="lbClose" aria-label="Fechar"><svg viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
  <video id="lbVideo" controls playsinline></video>
  <p class="lb-cap" id="lbCap"></p>
</div>

<script src="i18n.js?v=2"></script>
<script src="pecas.js?v=20260929e"></script>
<script>
/* IDIOMA: português é a fonte; o inglês é uma camada por cima.
   O que não estiver no i18n.js cai de volta pro português. */
let LANG = (function(){
  try { const g = localStorage.getItem("lang"); if (g) return g; } catch(e){}
  return (navigator.language || "").toLowerCase().indexOf("pt") === 0 ? "pt" : "en";
})();
function D(){ return LANG === "pt" ? null : (I18N[LANG] || null); }
function T(grupo, texto){
  const d = D();
  if (!d || !d[grupo]) return texto;
  return d[grupo][texto] || texto;
}
function U(chave, texto){
  const d = D();
  return (d && d.ui && d.ui[chave]) || texto;
}

const ICON_GRID = '<svg viewBox="0 0 24 24" fill="none"><path d="M4 4h7v7H4V4Zm9 0h7v7h-7V4ZM4 13h7v7H4v-7Zm9 0h7v7h-7v-7Z" fill="currentColor"/></svg>';
const ICON_PLAY = '<svg viewBox="0 0 24 24" fill="none"><path d="M8 5l11 7-11 7V5Z" fill="currentColor"/></svg>';

const OBS = [];
function render(){

/* HERO */
document.getElementById("mark").textContent = PERFIL.nome;
document.getElementById("heroConteudo").innerHTML =
  '<img class="avatar" src="' + PERFIL.foto + '" alt="' + PERFIL.nome + '" onerror="this.outerHTML=\'<div class=&quot;avatar-fb&quot;>FOTO</div>\'">' +
  '<div><h1>' + PERFIL.nome + '</h1><p class="bio">' + ((D() && D().bio) || PERFIL.bio) + '</p>' +
  '<div class="hero-links">' +
  '<a class="hlink" href="' + PERFIL.instagram + '" target="_blank" rel="noopener">' + PERFIL.arroba + '</a>' +
  '<a class="hlink" href="mailto:' + PERFIL.email + '">' + PERFIL.email + '</a>' +
  '</div></div>';

document.querySelector("#contato h2").textContent = U("contatoTitulo", "Manda a referência");
document.querySelector("#contato p").textContent = U("contatoSub", "Me diz o que você tem em mente. Eu produzo, você aprova.");
document.querySelector(".foot").textContent = U("rodape", "Dilo · editando desde 2020");
document.getElementById("lbClose").setAttribute("aria-label", U("fechar", "Fechar"));

document.getElementById("contatoLinks").innerHTML =
  '<a class="hlink" href="' + PERFIL.instagram + '" target="_blank" rel="noopener">' + PERFIL.arroba + '</a>' +
  '<a class="hlink" href="mailto:' + PERFIL.email + '">' + PERFIL.email + '</a>';

/* FAIXAS */
const nav = document.getElementById("nav");
const main = document.getElementById("faixas");

function montaCard(p){
  const card = document.createElement("article");
  card.className = "card" + (p.video || p.youtube || p.galeria ? " has-video" : "") + (p.formato === "16:9" || p.youtube ? " wide" : "");
  const tags = p.tags.map(function(t){ return '<span class="tag">' + T("tags", t) + '</span>'; }).join("");
  let media;
  if (p.youtube) {
    const capa = p.capa || ("https://img.youtube.com/vi/" + p.youtube + "/maxresdefault.jpg");
    media = '<div class="media"><img src="' + capa + '" alt="" loading="lazy"><span class="play-ico">' + ICON_PLAY + '</span><span class="selo">YouTube</span></div>';
  } else if (p.galeria) {
    media = '<div class="media"><img src="' + (p.capa || p.galeria[0]) + '" alt="" loading="lazy"><span class="play-ico">' + ICON_GRID + '</span><span class="selo">' + p.galeria.length + ' ' + U("imagens", "imagens") + '</span></div>';
  } else if (p.video) {
    media = '<div class="media"><video src="' + (p.preview || p.video) + '" ' + (p.capa ? 'poster="' + p.capa + '" ' : "") + 'muted loop playsinline preload="none"></video><span class="play-ico">' + ICON_PLAY + '</span></div>';
  } else {
    media = '<div class="media"><span class="empty">em breve</span></div>';
  }
  card.innerHTML = media + '<span class="c-title">' + T("titulos", p.titulo) + '</span><div class="tags">' + tags + '</div>';
  if (p.youtube || p.galeria) {
    card.querySelector(".media").addEventListener("click", function(){ abrir(p); });
  } else if (p.video) {
    const vid = card.querySelector("video");
    card.addEventListener("mouseenter", function(){ card.classList.add("playing"); vid.play().catch(function(){}); });
    card.addEventListener("mouseleave", function(){ card.classList.remove("playing"); vid.pause(); vid.currentTime = 0; });
    card.querySelector(".media").addEventListener("click", function(){ abrir(p); });
  }
  return card;
}

function setas(id){
  return '<div class="arrows">' +
    '<button class="arrow" data-rail="' + id + '" data-dir="-1" aria-label="Voltar"><svg viewBox="0 0 24 24" fill="none"><path d="M15 5L8 12l7 7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>' +
    '<button class="arrow next" data-rail="' + id + '" data-dir="1" aria-label="Avançar"><svg viewBox="0 0 24 24" fill="none"><path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>';
}

FAIXAS.forEach(function(faixa, i){
  const a = document.createElement("a");
  const tf = (D() && D().faixas && D().faixas[faixa.id]) || faixa;
  a.className = "pill"; a.href = "#" + faixa.id; a.textContent = tf.nome || faixa.nome;
  nav.appendChild(a);

  const sec = document.createElement("section");
  sec.className = "rail" + (faixa.destaque ? " lead" : "");
  sec.id = faixa.id;

  /* monta um bloco de ramificações: pílulas clicáveis + uma fila por ramo.
     Usado tanto pela faixa simples (nichos) quanto por cada grupo (grupos). */
  function montaRamos(destino, nichos, pecas, chave, titulo){
    const ramos = document.createElement("div");
    ramos.className = "ramos";
    if (titulo) {
      const h = document.createElement("h3");
      h.className = "grupo";
      h.textContent = titulo;
      destino.appendChild(h);
    }
    destino.appendChild(ramos);
    const filas = [];
    nichos.forEach(function(n, j){
      const lista = pecas.filter(function(p){ return p.nicho === n.id; })
        /* deitado junto com deitado, em pé junto com em pé: evita fila serrilhada */
        .sort(function(x, y){ return (x.formato === "16:9" || x.youtube ? 1 : 0) - (y.formato === "16:9" || y.youtube ? 1 : 0); });
      if (!lista.length) return;
      const id = "t" + chave + "_" + j;
      const bloco = document.createElement("div");
      bloco.className = "sub";
      bloco.innerHTML = '<div class="sub-head"><h3>' + T("ramos", n.nome) + '</h3>' + setas(id) + '</div>' +
                        '<div class="rail-track"><div class="track" id="' + id + '"></div></div>';
      const t = bloco.querySelector(".track");
      lista.forEach(function(p){ t.appendChild(montaCard(p)); });
      bloco.setAttribute("data-ramo", T("ramos", n.nome));
      destino.appendChild(bloco);
      filas.push(bloco);
    });
    filas.forEach(function(fila, k){
      const b = document.createElement("button");
      b.className = "ramo" + (k === 0 ? " on" : "");
      b.type = "button";
      b.textContent = fila.getAttribute("data-ramo") || fila.querySelector("h3").textContent;
      b.addEventListener("click", function(){
        ramos.querySelectorAll(".ramo").forEach(function(o){ o.classList.toggle("on", o === b); });
        filas.forEach(function(f, m){ f.hidden = m !== k; });
        window.dispatchEvent(new Event("resize"));
      });
      ramos.appendChild(b);
      fila.hidden = k !== 0;
      fila.querySelector("h3").hidden = true;
    });
    return filas.length;
  }

  if (faixa.grupos || faixa.nichos) {
    sec.innerHTML = '<div class="rail-head"><div><h2>' + (tf.nome || faixa.nome) + '</h2><p class="rail-sub">' + (tf.sub || faixa.sub) + '</p></div></div>';
    const usados = [];
    if (faixa.grupos) {
      /* dois níveis: a plataforma primeiro, o cliente dentro dela */
      faixa.grupos.forEach(function(g, gi){
        montaRamos(sec, g.nichos, faixa.pecas, i + "g" + gi, g.nome);
        g.nichos.forEach(function(n){ usados.push(n.id); });
      });
    } else {
      montaRamos(sec, faixa.nichos, faixa.pecas, "" + i, null);
      faixa.nichos.forEach(function(n){ usados.push(n.id); });
    }
    const orfas = faixa.pecas.filter(function(p){ return usados.indexOf(p.nicho) === -1; });
    if (orfas.length) {
      const id = "t" + i + "_x";
      const bloco = document.createElement("div");
      bloco.className = "sub";
      bloco.innerHTML = '<div class="sub-head"><h3>Outros</h3>' + setas(id) + '</div>' +
                        '<div class="rail-track"><div class="track" id="' + id + '"></div></div>';
      const t = bloco.querySelector(".track");
      orfas.forEach(function(p){ t.appendChild(montaCard(p)); });
      sec.appendChild(bloco);
    }
  } else {
    const id = "t" + i;
    sec.innerHTML = '<div class="rail-head"><div><h2>' + (tf.nome || faixa.nome) + '</h2><p class="rail-sub">' + (tf.sub || faixa.sub) + '</p></div>' +
                    setas(id) + '</div><div class="rail-track"><div class="track" id="' + id + '"></div></div>';
    const t = sec.querySelector(".track");
    faixa.pecas.forEach(function(p){ t.appendChild(montaCard(p)); });
  }

  main.appendChild(sec);
});

const cPill = document.createElement("a");
cPill.className = "pill"; cPill.href = "#contato"; cPill.textContent = U("contatoPill", "Contato");
nav.appendChild(cPill);

/* setas */
document.querySelectorAll(".arrow").forEach(function(btn){
  btn.addEventListener("click", function(){
    const track = document.getElementById(btn.dataset.rail);
    const card = track.querySelector(".card");
    const step = card ? card.getBoundingClientRect().width + 12 : 200;
    track.scrollBy({ left: step * 2 * Number(btn.dataset.dir), behavior: "smooth" });
  });
});

document.querySelectorAll(".track").forEach(function(track){
  /* as setas moram no cabeçalho do PRÓPRIO bloco. Buscar na seção inteira
     fazia todas as filas de uma faixa ramificada mexerem nas setas da
     primeira, e a última medição (de uma fila escondida) escondia elas. */
  const bloco = track.closest(".sub") || track.closest(".rail");
  const prev = bloco.querySelector('.arrow[data-dir="-1"]');
  const next = bloco.querySelector(".arrow.next");
  const moldura = track.closest(".rail-track");

  function medir(){
    const sobra = track.scrollWidth - track.clientWidth;
    if (sobra < 8){ prev.hidden = true; next.hidden = true; moldura.classList.remove("more"); return; }
    prev.hidden = false; next.hidden = false;
    const fim = track.scrollLeft >= sobra - 8;
    prev.disabled = track.scrollLeft < 8;
    next.disabled = fim;
    next.classList.toggle("live", !fim);
    moldura.classList.toggle("more", !fim);
    if (fim) next.classList.remove("grow");
  }
  track.addEventListener("mousemove", function(e){
    if (next.disabled || next.hidden) return;
    next.classList.toggle("grow", track.getBoundingClientRect().right - e.clientX < 250);
  });
  track.addEventListener("mouseleave", function(){ next.classList.remove("grow"); });
  track.addEventListener("scroll", medir, { passive:true });
  window.addEventListener("resize", medir);

  medir();
});

/* nav ativa conforme rola — os observadores antigos saem antes,
   senao cada troca de idioma deixaria um jogo novo pendurado */
OBS.forEach(function(o){ o.disconnect(); });
OBS.length = 0;
const pills = [].slice.call(document.querySelectorAll(".pill"));
[].slice.call(document.querySelectorAll(".rail, .closing")).forEach(function(s){
  const o = new IntersectionObserver(function(entradas){
    entradas.forEach(function(e){
      if (e.isIntersecting) pills.forEach(function(p){ p.classList.toggle("on", p.getAttribute("href") === "#" + e.target.id); });
    });
  }, { rootMargin:"-45% 0px -50% 0px" });
  o.observe(s);
  OBS.push(o);
});

}  /* fim do render */

render();

/* troca de idioma: limpa e remonta */
const btLang = document.getElementById("lang");
function pintaBotao(){
  btLang.textContent = LANG === "pt" ? "EN" : "PT";
  document.documentElement.lang = LANG === "pt" ? "pt-BR" : "en";
}
pintaBotao();
btLang.addEventListener("click", function(){
  LANG = LANG === "pt" ? "en" : "pt";
  try { localStorage.setItem("lang", LANG); } catch(e){}
  pintaBotao();
  if (window.rotulaCurtida) window.rotulaCurtida();
  document.getElementById("nav").innerHTML = "";
  document.getElementById("faixas").innerHTML = "";
  render();
});

/* CURTIDA
   Contador publico e anonimo: guarda so um numero, nenhum dado de quem clicou.
   Roda no Abacus (abacus.jasoncameron.dev), gratis e sem conta. Se um dia sair
   do ar, o botao simplesmente nao aparece — a pagina nao quebra.
   Pra trocar de servico, muda so as duas URLs aqui embaixo. */
const CURTIDA = {
  ler:  "https://abacus.jasoncameron.dev/get/dilomendes-portfolio/curtidas-portfolio",
  somar:"https://abacus.jasoncameron.dev/hit/dilomendes-portfolio/curtidas-portfolio"
};

(function(){
  const bt = document.getElementById("curtir");
  const txt = document.getElementById("curtirTxt");
  const num = document.getElementById("curtirN");
  let jaCurtiu = false;
  try { jaCurtiu = localStorage.getItem("curtiu") === "1"; } catch(e){}

  function rotula(){
    txt.textContent = jaCurtiu ? U("curtido", "Valeu!") : U("curtir", "Curtir");
    bt.classList.toggle("on", jaCurtiu);
  }
  window.rotulaCurtida = rotula;

  function mostra(n){
    num.textContent = (typeof n === "number" && n > 0) ? n : "";
    bt.hidden = false;
    rotula();
  }

  fetch(CURTIDA.ler)
    .then(function(r){ return r.json(); })
    .then(function(d){ mostra(typeof d.value === "number" ? d.value : 0); })
    .catch(function(){ /* fora do ar: o botao fica escondido */ });

  bt.addEventListener("click", function(){
    if (jaCurtiu) return;
    jaCurtiu = true;
    try { localStorage.setItem("curtiu", "1"); } catch(e){}
    const atual = parseInt(num.textContent, 10) || 0;
    num.textContent = atual + 1;
    rotula();
    fetch(CURTIDA.somar)
      .then(function(r){ return r.json(); })
      .then(function(d){ if (typeof d.value === "number") num.textContent = d.value; })
      .catch(function(){ /* o numero real chega na proxima visita */ });
  });
})();

/* lightbox */
const lb = document.getElementById("lb"), lbVideo = document.getElementById("lbVideo"), lbCap = document.getElementById("lbCap");
const lbFrame = document.createElement("iframe");
lbFrame.className = "lb-frame";
lbFrame.allow = "accelerometer; autoplay; encrypted-media; picture-in-picture";
lbFrame.allowFullscreen = true;
lbFrame.hidden = true;
lb.insertBefore(lbFrame, lbCap);
const lbGrid = document.createElement("div");
lbGrid.className = "lb-grid";
lbGrid.hidden = true;
lb.insertBefore(lbGrid, lbCap);

function abrir(p){
  lbCap.textContent = T("titulos", p.titulo) + (p.trecho ? "  ·  " + U("trecho", "trecho de 30s") : "");
  if (p.galeria) {
    lbVideo.hidden = true; lbFrame.hidden = true; lbGrid.hidden = false;
    lbGrid.innerHTML = p.galeria.map(function(src){ return '<img src="' + src + '" alt="" loading="lazy">'; }).join("");
  } else if (p.youtube) {
    lbGrid.hidden = true; lbVideo.hidden = true; lbFrame.hidden = false;
    lbFrame.src = "https://www.youtube-nocookie.com/embed/" + p.youtube + "?autoplay=1&rel=0";
  } else {
    lbGrid.hidden = true; lbFrame.hidden = true; lbVideo.hidden = false;
    lbVideo.src = p.video; lbVideo.play().catch(function(){});
  }
  lb.setAttribute("open","");
}
function fechar(){
  lb.removeAttribute("open");
  lbVideo.pause(); lbVideo.removeAttribute("src"); lbVideo.load();
  lbFrame.removeAttribute("src"); lbFrame.hidden = true;
  lbGrid.innerHTML = ""; lbGrid.hidden = true; lbVideo.hidden = false;
}
document.getElementById("lbClose").addEventListener("click", fechar);
lb.addEventListener("click", function(e){ if (e.target === lb) fechar(); });
document.addEventListener("keydown", function(e){ if (e.key === "Escape" && lb.hasAttribute("open")) fechar(); });
</script>
